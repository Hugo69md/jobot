name: jobot — scrape, score & notify

on:
  schedule:
    # 11:00 AM UTC+1  →  10:00 UTC
    - cron: "0 10 * * *"
    # 4:00 PM UTC+1   →  15:00 UTC  (16:00 in 24h = 15:00 UTC)
    - cron: "0 15 * * *"
  workflow_dispatch: # allow manual runs from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 359   # 5-hour hard limit (well under GHA's 6-hour wall)
    permissions:
      contents: read

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      OLLAMA_API_KEY:     ${{ secrets.OLLAMA_API_KEY }}
      # Poll for Telegram YES/NO callbacks for 2 minutes after sending all offers.
      # Set to 0 to disable callback polling entirely.
      TELEGRAM_POLL_TIMEOUT: "120"
      OLLAMA_MODEL: "qwen3.5:4b"

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Python dependencies ──────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # ── 4. Ollama — restore model cache ─────────────────────────
      - name: Cache Ollama model
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}

      # ── 5. Ollama — install & start ──────────────────────────────
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Install script starts ollama via systemd — no need for "ollama serve &"
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags && break
            sleep 2
          done

      # ── 6. Ollama — ensure model is registered & loaded ──────────
      - name: Ensure Ollama model is ready
        run: |
          # Always pull: on cache hit it just re-registers the model (instant, no download).
          # On cache miss it downloads the full model.
          ollama pull ${{ env.OLLAMA_MODEL }}
          # Warm-up: load model into memory
          curl -sf http://localhost:11434/api/generate \
            -d '{"model": "${{ env.OLLAMA_MODEL }}", "prompt": "hi", "stream": false}' \
            > /dev/null
          echo "✅ Model ${{ env.OLLAMA_MODEL }} is loaded and ready"
          
       # ── 7. Run the pipeline ──────────────────────────────────────
      - name: Run jobot pipeline (max_offers=2)
        id: pipeline
        env:
          MAX_OFFERS: "7"
        run: |
          python main.py
          # Find the most recent data folder created in this run
          LATEST_DIR=$(ls -dt outputs/data\[*\] | head -1)
          echo "output_dir=$LATEST_DIR" >> "$GITHUB_OUTPUT"

      # ── 8. Upload outputs as artifacts (for debugging) ───────────
      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobot-outputs-${{ github.run_id }}
          path: ${{ steps.pipeline.outputs.output_dir }}
          retention-days: 7
          if-no-files-found: warn
